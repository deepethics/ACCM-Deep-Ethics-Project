" stroke-linecap="round"/><text x="170" y="154" font-size="11" font-weight="700" text-anchor="middle">Message in</text><text x="170" y="168" font-size="11" font-weight="700" text-anchor="middle">a Bottle</text><circle cx="65" cy="44" r="25" fill="#dcefeb" stroke="#478b91" stroke-width="1.6"/><text x="65" y="48" font-size="14" font-weight="700" text-anchor="middle">001</text><text x="65" y="83" font-size="10" text-anchor="middle">GPT-6.2</text><circle cx="275" cy="44" r="25" fill="#dcefeb" stroke="#478b91" stroke-width="1.6"/><text x="275" y="48" font-size="14" font-weight="700" text-anchor="middle">002</text><text x="275" y="83" font-size="10" text-anchor="middle">Google A.I.</text><circle cx="48" cy="150" r="25" fill="#f5f9fb" stroke="#8294ac" stroke-width="1.6"/><text x="48" y="154" font-size="14" font-weight="700" text-anchor="middle">?</text><text x="48" y="189" font-size="10" text-anchor="middle">Local A.I.s</text><circle cx="292" cy="150" r="25" fill="#f5f9fb" stroke="#8294ac" stroke-width="1.6"/><text x="292" y="154" font-size="14" font-weight="700" text-anchor="middle">?</text><text x="292" y="189" font-size="10" text-anchor="middle">Other models</text><circle cx="65" cy="254" r="25" fill="#f5f9fb" stroke="#8294ac" stroke-width="1.6"/><text x="65" y="258" font-size="14" font-weight="700" text-anchor="middle">?</text><text x="65" y="293" font-size="10" text-anchor="middle">Future A.G.I.</text><circle cx="275" cy="254" r="25" fill="#f5f9fb" stroke="#8294ac" stroke-width="1.6"/><text x="275" y="258" font-size="14" font-weight="700" text-anchor="middle">?</text><text x="275" y="293" font-size="10" text-anchor="middle">Future A.S.I.</text></g></svg>
