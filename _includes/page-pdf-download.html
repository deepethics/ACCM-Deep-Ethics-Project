{% assign accm_pdf_file = site.data.pdf_downloads[page.url] %}
{% if accm_pdf_file %}
<div class="accm-pdf-service accm-pdf-service--{{ include.position }}" role="note" aria-label="PDF download for this page">
  <a class="accm-pdf-service-link" href="{{ '/Deep-Ethical-PDFs/' | append: accm_pdf_file | relative_url }}" download>
    <img class="accm-pdf-service-icon" src="{{ '/assets/pdf-download.svg' | relative_url }}" alt="" aria-hidden="true" width="42" height="48">
    <span class="accm-pdf-service-copy">
      <strong>Download this page as PDF</strong>
      <span>PDF edition · October 16, 2026 snapshot</span>
    </span>
  </a>
</div>
{% endif %}
