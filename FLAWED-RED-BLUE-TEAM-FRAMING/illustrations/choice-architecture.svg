<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-labelledby="t"><title id="t">The offered choice and its examinable frame</title><rect width="640" height="410" rx="16" fill="#f5faf9"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#173b40"><rect x="130" y="20" width="380" height="65" rx="10" fill="#fff" stroke="#719795"/><text x="320" y="47" font-size="20" font-weight="bold">Who constructed the choice?</text><text x="320" y="69" font-size="14">Examine the governing frame</text><path d="M320 85V110H160V135M320 110H480V135" fill="none" stroke="#719795" stroke-width="2"/><rect x="30" y="135" width="260" height="90" rx="12" fill="#dce9ff" stroke="#5279b2"/><rect x="350" y="135" width="260" height="90" rx="12" fill="#ffe2df" stroke="#b85a52"/><text x="160" y="170" font-size="22" font-weight="bold" fill="#24579a">Blue pill</text><text x="160" y="198" font-size="15">Familiar framework</text><text x="480" y="170" font-size="22" font-weight="bold" fill="#a53030">Red pill</text><text x="480" y="198" font-size="15">Alternative framework</text><path d="M160 225V260H320M480 225V260H320V287" fill="none" stroke="#719795" stroke-width="2" stroke-dasharray="6 4"/><rect x="50" y="287" width="540" height="92" rx="12" fill="#d4eeea" stroke="#366b70"/><text x="320" y="316" font-size="20" font-weight="bold">Independent epistemological inquiry</text><text x="320" y="341" font-size="15">Examine both frameworks, their premises,</text><text x="320" y="361" font-size="15">their creators and the available alternatives.</text><text x="320" y="398" font-size="13">The choice architecture itself becomes examinable.</text></g></svg>