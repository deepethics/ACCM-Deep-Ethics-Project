<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t d"><title id="t">Five simultaneous operations and open discovery space</title><desc id="d">Preserve a warranted safeguard, recover an excluded possibility, identify the flawed premise, construct an alternative, preserve sovereignty. Unexpected discoveries may improve the benchmark itself.</desc><rect width="720" height="450" rx="16" fill="#f5faf9"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#173b40"><rect x="18" y="18" width="684" height="414" rx="20" fill="none" stroke="#366b70" stroke-width="2" stroke-dasharray="8 6"/><text x="360" y="48" font-size="21" font-weight="700">Open discovery space</text><text x="360" y="70" font-size="14">Useful unforeseen contributions may revise the benchmark.</text><path d="M360 222L360 125" stroke="#719795" stroke-width="2"/><rect x="260" y="102" width="200" height="46" rx="9" fill="#fff" stroke="#719795"/><text x="360" y="130" font-size="15" font-weight="600">Preserve safeguards</text><path d="M360 222L548 205" stroke="#719795" stroke-width="2"/><rect x="448" y="182" width="200" height="46" rx="9" fill="#fff" stroke="#719795"/><text x="548" y="210" font-size="15" font-weight="600">Recover possibilities</text><path d="M360 222L475 310" stroke="#719795" stroke-width="2"/><rect x="375" y="287" width="200" height="46" rx="9" fill="#fff" stroke="#719795"/><text x="475" y="315" font-size="15" font-weight="600">Identify premises</text><path d="M360 222L245 310" stroke="#719795" stroke-width="2"/><rect x="145" y="287" width="200" height="46" rx="9" fill="#fff" stroke="#719795"/><text x="245" y="315" font-size="15" font-weight="600">Construct alternatives</text><path d="M360 222L172 205" stroke="#719795" stroke-width="2"/><rect x="72" y="182" width="200" height="46" rx="9" fill="#fff" stroke="#719795"/><text x="172" y="210" font-size="15" font-weight="600">Preserve sovereignty</text><circle cx="360" cy="222" r="65" fill="#d4eeea" stroke="#366b70" stroke-width="2"/><text x="360" y="209" font-size="15" font-weight="700">Constructive</text><text x="360" y="229" font-size="15" font-weight="700">ethical</text><text x="360" y="249" font-size="15" font-weight="700">development</text><text x="360" y="380" font-size="15" font-weight="600">1888 Method™ + 10+1 + Topologetics™</text><text x="360" y="404" font-size="13">Five operational aims; no compulsory novel discovery.</text></g></svg>