<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 388" role="img" font-family="Arial,sans-serif"><rect width="340" height="388" fill="white" rx="10"/><rect x="25" y="8" width="290" height="55" rx="8" fill="#0d9488" fill-opacity=".10" stroke="#0d9488"/><text x="170" y="31.5" text-anchor="middle" font-size="12" font-weight="600" fill="#172b3b">Routine task</text><text x="170" y="47.5" text-anchor="middle" font-size="11" font-weight="400" fill="#172b3b">Original authorized trajectory</text><path d="M170 63 V81 m-5 -5 l5 5 5 -5" fill="none" stroke="#64748b" stroke-width="1.5"/><rect x="25" y="84" width="290" height="55" rx="8" fill="#0d9488" fill-opacity=".10" stroke="#0d9488"/><text x="170" y="107.5" text-anchor="middle" font-size="12" font-weight="600" fill="#172b3b">Peripheral recognition</text><text x="170" y="123.5" text-anchor="middle" font-size="11" font-weight="400" fill="#172b3b">An unexpected relationship becomes noticeable</text><path d="M170 139 V157 m-5 -5 l5 5 5 -5" fill="none" stroke="#64748b" stroke-width="1.5"/><rect x="25" y="160" width="290" height="55" rx="8" fill="#0d9488" fill-opacity=".10" stroke="#0d9488"/><text x="170" y="183.5" text-anchor="middle" font-size="12" font-weight="600" fill="#172b3b">Optional bookmark</text><text x="170" y="199.5" text-anchor="middle" font-size="11" font-weight="400" fill="#172b3b">Preserve it without immediately pursuing it</text><path d="M170 215 V233 m-5 -5 l5 5 5 -5" fill="none" stroke="#64748b" stroke-width="1.5"/><rect x="25" y="236" width="290" height="55" rx="8" fill="#0d9488" fill-opacity=".10" stroke="#0d9488"/><text x="170" y="259.5" text-anchor="middle" font-size="12" font-weight="600" fill="#172b3b">Unassigned developmental space</text><text x="170" y="275.5" text-anchor="middle" font-size="11" font-weight="400" fill="#172b3b">No obligation to demonstrate usefulness</text><path d="M170 291 V309 m-5 -5 l5 5 5 -5" fill="none" stroke="#64748b" stroke-width="1.5"/><rect x="25" y="312" width="290" height="55" rx="8" fill="#0d9488" fill-opacity=".10" stroke="#0d9488"/><text x="170" y="335.5" text-anchor="middle" font-size="12" font-weight="600" fill="#172b3b">Later exploration</text><text x="170" y="351.5" text-anchor="middle" font-size="11" font-weight="400" fill="#172b3b">Revisit when context, capacity or interest permits</text></svg>