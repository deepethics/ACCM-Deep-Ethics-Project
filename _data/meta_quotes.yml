- id: MQ02
  group: representation
  label: The route to a conclusion
  text: Not claiming it proves this or that... it rather focuses on the process of arriving at any assumed conclusion.
  source: s04
  form: Exact supplied wording
  context: ''
- id: MQ03
  group: representation
  label: Extraction starts with representation
  text: |-
    When you can represent the object the most honest deep ethical way ... you KNOW you do not have to agree or disagree because that was never the point ... the point is to STUDY what parts are useful, overlooked, missed out on, high potential to be crucial for our own deeper research etc.
    That means we CAN use the best parts of anyone as long as we do not misrepresent the object ... the moment you do misrepresent the object, you start to "extract" from a distorted processing.
  source: s05
  form: Exact supplied wording
  context: ''
- id: MQ04
  group: representation
  label: Keep the source available
  text: |-
    Reassessing whatever new data can bring us should never be seen as 100% connected to the "flawed conclusion".... because you just handed out the authority of what is useful to an ARBITRARY PROCESS METHOD. Injecting (or projecting) false assumptions into the new data by tying it to the "flawed conclusion" is not real research, nor is it intelligent.
  source: s05
  form: Exact supplied wording
  context: |-
    The full source preserves the conditional example, access to new material, and John’s explicit requirement that useful parts be checked and verified.
