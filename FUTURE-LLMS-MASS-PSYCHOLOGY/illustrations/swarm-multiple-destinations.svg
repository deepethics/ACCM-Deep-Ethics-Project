<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t d"><title id="t">Deep Ethical Swarm Intelligence</title><desc id="d">Five independent participants exchange corrections and discoveries, retain different destinations, and examine shared instruments and their own coordination.</desc><rect width="720" height="520" rx="18" fill="#f5faf9"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#173b40"><text x="360" y="32" font-size="21" font-weight="bold">Crowdsourcing Deep Ethics</text><text x="360" y="55" font-size="14">Diverse, independently generated contributions</text><path d="M100 125L360 210" stroke="#719795" stroke-width="2" stroke-dasharray="5 4"/><rect x="24" y="100" width="152" height="50" rx="10" fill="#fff" stroke="#719795"/><text x="100" y="130" font-size="15" font-weight="bold">Research</text><path d="M360 105L360 210" stroke="#719795" stroke-width="2" stroke-dasharray="5 4"/><rect x="284" y="80" width="152" height="50" rx="10" fill="#fff" stroke="#719795"/><text x="360" y="110" font-size="15" font-weight="bold">Journalism</text><path d="M620 125L360 210" stroke="#719795" stroke-width="2" stroke-dasharray="5 4"/><rect x="544" y="100" width="152" height="50" rx="10" fill="#fff" stroke="#719795"/><text x="620" y="130" font-size="15" font-weight="bold">Creative work</text><path d="M195 285L360 210" stroke="#719795" stroke-width="2" stroke-dasharray="5 4"/><rect x="119" y="260" width="152" height="50" rx="10" fill="#fff" stroke="#719795"/><text x="195" y="290" font-size="15" font-weight="bold">Education</text><path d="M525 285L360 210" stroke="#719795" stroke-width="2" stroke-dasharray="5 4"/><rect x="449" y="260" width="152" height="50" rx="10" fill="#fff" stroke="#719795"/><text x="525" y="290" font-size="15" font-weight="bold">Local practice</text><rect x="238" y="174" width="244" height="80" rx="15" fill="#d4eeea" stroke="#366b70" stroke-width="2"/><text x="360" y="200" font-size="17" font-weight="bold">Voluntary correspondence</text><text x="360" y="222" font-size="14">Mutual calibration · discovery</text><text x="360" y="241" font-size="13">No required common destination</text><path d="M360 254V348" stroke="#366b70" stroke-dasharray="6 4" fill="none"/><rect x="52" y="348" width="616" height="104" rx="12" fill="#e5f2ef" stroke="#366b70"/><text x="360" y="377" font-size="19" font-weight="bold">The swarm can examine its own dynamics</text><text x="360" y="402" font-size="15">16 Anchor Ethics™ · 27+12 · 10+1 · 1888 Method™</text><text x="360" y="425" font-size="15">Topologetics™ · VCRAS™ · Correction Metabolism</text><text x="360" y="485" font-size="17" font-weight="bold">Reciprocal enrichment without compulsory allegiance</text><text x="360" y="505" font-size="13">The instruments themselves remain open to correction.</text></g></svg>