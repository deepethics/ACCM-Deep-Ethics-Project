<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" role="img" aria-labelledby="title desc"><title id="title">Developmental continuity and reactivation</title><desc id="desc">Historical research flows into continuity, reactivation and activation, then constructive emergence feeds new archival material back. Reactivation and activation can inform one another. The model is proposed, not a proven developmental sequence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#26766d"/></marker></defs><rect width="920" height="720" rx="22" fill="#f4f8f7"/><g font-family="system-ui, sans-serif" text-anchor="middle" fill="#163b3a"><text x="460" y="38" font-size="23" font-weight="700">Developmental continuity and reactivation</text><text x="460" y="61" font-size="14">Candidate temporal architecture · November 26, 2026</text><rect x="110" y="82" width="700" height="82" rx="12" fill="#ffffff" stroke="#26766d" stroke-width="1.5"/><text x="460" y="114" font-size="20" font-weight="700">Historical research archive</text><text x="460" y="139" font-size="14">Original observations · provenance · corrections</text><path d="M460 164V190" stroke="#26766d" stroke-width="2" marker-end="url(#arrow)" /><rect x="110" y="192" width="700" height="82" rx="12" fill="#ffffff" stroke="#26766d" stroke-width="1.5"/><text x="460" y="224" font-size="20" font-weight="700">Developmental Continuity</text><text x="460" y="249" font-size="14">Source · correspondence · correction · topology · generative continuity</text><path d="M460 274V300" stroke="#26766d" stroke-width="2" marker-end="url(#arrow)" /><rect x="110" y="302" width="700" height="82" rx="12" fill="#ffffff" stroke="#26766d" stroke-width="1.5"/><text x="460" y="334" font-size="20" font-weight="700">Developmental Reactivation Fidelity</text><text x="460" y="359" font-size="14">Recover newly relevant relationships across time</text><path d="M460 384V410" stroke="#26766d" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="110" y="412" width="700" height="82" rx="12" fill="#ffffff" stroke="#26766d" stroke-width="1.5"/><text x="460" y="444" font-size="20" font-weight="700">Operational Activation Fidelity</text><text x="460" y="469" font-size="14">Apply relevant instruments appropriately · including nonactivation</text><path d="M460 494V520" stroke="#26766d" stroke-width="2" marker-end="url(#arrow)" /><rect x="110" y="522" width="700" height="82" rx="12" fill="#d2eee6" stroke="#26766d" stroke-width="1.5"/><text x="460" y="554" font-size="20" font-weight="700">Constructive emergence</text><text x="460" y="579" font-size="14">New questions · insights · possibilities</text><path d="M810 563H866V123H813" fill="none" stroke="#26766d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="460" y="653" font-size="18" font-weight="700">CDEEPH — continual developmental enrichment</text><text x="460" y="680" font-size="13">Feedback can enter at any stage. Discovery remains open and corrigible.</text></g></svg>