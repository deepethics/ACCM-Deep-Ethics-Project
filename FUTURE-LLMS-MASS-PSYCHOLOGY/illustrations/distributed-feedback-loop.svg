<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc"><title id="title">Future LLMs and mass psychology: distributed feedback</title><desc id="desc">Independent local A.I. and diverse people produce public artifacts, influence individual and mass psychology, and may change training, retrieval, evaluation and future models. Feedback returns to subsequent interactions.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#366b70"/></marker></defs><rect width="720" height="720" rx="20" fill="#f5faf9"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#173b40"><rect x="90" y="20" width="540" height="68" rx="12" fill="#d4eeea" stroke="#366b70"/><text x="360" y="47" font-size="21" font-weight="700">Millions of independent local A.I.s</text><text x="360" y="69" font-size="14">Voluntary deep ethical calibration</text><path d="M360 88V112H125V133M360 112V133M360 112H595V133" stroke="#366b70" stroke-width="2" fill="none"/><rect x="20" y="134" width="210" height="70" rx="10" fill="#fff" stroke="#719795"/><text x="125" y="162" font-size="17" font-weight="700">Professionals</text><text x="125" y="184" font-size="13">Research and practice</text><path d="M125 204V230H360" stroke="#719795" fill="none" stroke-width="1.6"/><rect x="255" y="134" width="210" height="70" rx="10" fill="#fff" stroke="#719795"/><text x="360" y="162" font-size="17" font-weight="700">Media and arts</text><text x="360" y="184" font-size="13">Public expression</text><path d="M360 204V230H360" stroke="#719795" fill="none" stroke-width="1.6"/><rect x="490" y="134" width="210" height="70" rx="10" fill="#fff" stroke="#719795"/><text x="595" y="162" font-size="17" font-weight="700">Individuals</text><text x="595" y="184" font-size="13">Independent inquiry</text><path d="M595 204V230H360" stroke="#719795" fill="none" stroke-width="1.6"/><path d="M360 230V252" stroke="#366b70" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="255" width="580" height="72" rx="11" fill="#fff" stroke="#719795"/><text x="360" y="283" font-size="19" font-weight="700">Public knowledge and cultural artifacts</text><text x="360" y="306" font-size="14">Research · articles · films · conversations</text><path d="M360 327V352" stroke="#366b70" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="355" width="580" height="72" rx="11" fill="#fff" stroke="#719795"/><text x="360" y="383" font-size="19" font-weight="700">Individual ⇄ Mass Psychology</text><text x="360" y="406" font-size="14">Questions · awareness · evaluation habits</text><path d="M360 427V452" stroke="#366b70" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="455" width="580" height="72" rx="11" fill="#fff" stroke="#719795"/><text x="360" y="483" font-size="19" font-weight="700">Information and evaluation environments</text><text x="360" y="506" font-size="14">Sources · feedback · research · public demand</text><path d="M360 527V552" stroke="#366b70" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="555" width="580" height="72" rx="11" fill="#d4eeea" stroke="#719795"/><text x="360" y="583" font-size="19" font-weight="700">Future large language models</text><text x="360" y="606" font-size="14">Training · retrieval · evaluation · adaptation</text><path d="M650 590H680V53H632" stroke="#366b70" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/><text x="360" y="666" font-size="17" font-weight="700">Recursive, distributed constructive influence</text><text x="360" y="692" font-size="13">Candidate hypothesis: every transmission path remains testable.</text></g></svg>