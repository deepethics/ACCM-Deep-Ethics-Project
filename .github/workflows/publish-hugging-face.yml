name: Publish public site to Hugging Face

on:
  workflow_run:
    workflows:
      - Deploy ACCM Deep Ethics Project umbrella site
      - Weekly public-page PDF refresh
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hugging-face-public-site
  cancel-in-progress: false

permissions:
  actions: read
  id-token: write

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HF_SPACE: ACCM-Deep-Ethics-Project/ACCM-Deep-Ethics-Project
      SITE_PATH: ACCM-Deep-Ethics-Project

    steps:
      - name: Select the latest successful Pages build
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Select again when a queued publish starts so a late event cannot
          # replace a newer mirror with an older snapshot.
          pages_run="$(
            for workflow in jekyll-gh-pages.yml weekly-pdf-refresh.yml; do
              gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                -f branch=main -f status=success -f per_page=8 \
                --jq '.workflow_runs[] | {id, updated_at}'
            done | jq -es 'sort_by(.updated_at, .id) | last | .id // empty'
          )"
          if [[ -z "$pages_run" ]]; then
            echo "::error::No successful Pages workflow run is available."
            exit 1
          fi
          echo "run_id=$pages_run" >> "$GITHUB_OUTPUT"

      - name: Download the deployed Pages artifact
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.pages.outputs.run_id }}

      - name: Assemble and check the Static Space files
        shell: bash
        run: |
          space_dir="$RUNNER_TEMP/hf-space"
          site_dir="$space_dir/$SITE_PATH"
          mkdir -p "$site_dir"
          tar --extract --file "$RUNNER_TEMP/pages-artifact/artifact.tar" \
            --directory "$site_dir" --no-same-owner --no-same-permissions

          # Keep the Pages base path so project routes, assets, and downloads
          # resolve on the Space as they do on GitHub Pages.
          python - "$site_dir" "$SITE_PATH" <<'PY'
          from html import escape, unescape
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import sys
          from urllib.parse import quote, unquote, urljoin, urlsplit, urlunsplit

          site_dir = Path(sys.argv[1])
          base = "/" + sys.argv[2] + "/"
          attribute = re.compile(r"""(\s+)([\w:-]+)(\s*=\s*)(["'])(.*?)\4""", re.DOTALL)


          class SpaceLinks(HTMLParser):
              def __init__(self, source, page_url):
                  super().__init__(convert_charrefs=False)
                  self.page_url = page_url
                  self.line_offsets = [0, *(match.end() for match in re.finditer(r"\n", source))]
                  self.edits = []
                  self.feed(source)
                  self.close()

              def handle_starttag(self, tag, attrs):
                  raw = self.get_starttag_text()
                  updated = attribute.sub(self.rewrite_attribute, raw)
                  if updated != raw:
                      line, column = self.getpos()
                      start = self.line_offsets[line - 1] + column
                      self.edits.append((start, start + len(raw), updated))

              def rewrite_attribute(self, match):
                  space, name, assignment, delimiter, value = match.groups()
                  if name.lower() not in {"href", "src", "action"}:
                      return match[0]

                  url = urlsplit(unescape(value))
                  if url.scheme or url.netloc or not url.path:
                      return match[0]

                  target = urlsplit(urljoin(self.page_url, url.geturl()))
                  if not target.path.startswith(base):
                      return match[0]

                  relative = unquote(target.path.removeprefix(base)).rstrip("/")
                  if not (site_dir / relative / "index.html").is_file():
                      return match[0]

                  path = quote(f"{base}{relative}/index.html" if relative else f"{base}index.html")
                  url = urlunsplit(("", "", path, target.query, target.fragment))
                  return f"{space}{name}{assignment}{delimiter}{escape(url, quote=True)}{delimiter}"


          for page in site_dir.rglob("*.html"):
              source = page.read_text(encoding="utf-8")
              page_url = base + quote(page.relative_to(site_dir).as_posix())
              edits = SpaceLinks(source, page_url).edits
              if edits:
                  chunks = []
                  cursor = 0
                  for start, end, replacement in edits:
                      chunks.extend((source[cursor:start], replacement))
                      cursor = end
                  chunks.append(source[cursor:])
                  page.write_text("".join(chunks), encoding="utf-8")

          service = site_dir / "assets/page-pdf-download.js"
          source = service.read_text(encoding="utf-8")
          old = "let path = window.location.pathname;"
          assert source.count(old) == 1, "Unexpected PDF service route handling"
          service.write_text(
              source.replace(old, r'let path = window.location.pathname.replace(/\/index\.html$/, "/");'),
              encoding="utf-8",
          )
          PY

          cp "$site_dir/index.html" "$space_dir/index.html"
          cat > "$space_dir/README.md" <<'EOF'
          ---
          title: ACCM Deep Ethics Project
          emoji: 🔥
          colorFrom: green
          colorTo: gray
          sdk: static
          app_file: index.html
          pinned: false
          short_description: Public mirror of the ACCM Deep Ethics Project
          ---
          This Space mirrors the public ACCM Deep Ethics Project website.

          [Canonical site](https://deepethics.github.io/ACCM-Deep-Ethics-Project/) · [Source on GitHub](https://github.com/deepethics/ACCM-Deep-Ethics-Project)
          EOF

          test -s "$site_dir/GROKIPEDIA-ETHICS-TAXONOMY/index.html"
          test -s "$site_dir/CANONICAL-SOURCES/index.html"
          test -s "$site_dir/COLD-TESTS/index.html"
          test -s "$site_dir/Deep-Ethical-PDFs/ACCM-Deep-Ethics-Project-All-Public-Pages.zip"
          du -sh "$space_dir"

      - name: Install the Hugging Face CLI
        run: python -m pip install 'huggingface_hub==1.19.0'

      - name: Publish the rendered site with the Trusted Publisher
        env:
          HF_OIDC_RESOURCE: spaces/${{ env.HF_SPACE }}
          PAGES_RUN_ID: ${{ steps.pages.outputs.run_id }}
        shell: bash
        run: |
          hf upload "$HF_SPACE" "$RUNNER_TEMP/hf-space" . --repo-type space \
            --delete "$SITE_PATH/*" \
            --commit-message "Mirror GitHub Pages deployment $PAGES_RUN_ID"
