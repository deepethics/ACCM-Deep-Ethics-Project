# Editing this workflow bootstraps missing PDFs; scheduled/manual runs retain their existing refresh path.
name: Weekly public-page PDF refresh

on:
  push:
    paths:
      - ".github/workflows/weekly-pdf-refresh.yml"
      - "HUMOR/index.md"
  schedule:
    - cron: "35 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-pdf-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Humor source change on push
        id: humor-change
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- HUMOR/index.md | grep -Fxq 'HUMOR/index.md'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install PDF export tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc texlive-xetex texlive-fonts-recommended fonts-dejavu-core poppler-utils librsvg2-bin

      - name: Bootstrap missing PDFs only on push
        if: github.event_name == 'push'
        run: python .github/scripts/bootstrap_missing_pdfs.py

      - name: Refresh Humor PDF on source update
        if: github.event_name == 'push' && steps.humor-change.outputs.changed == 'true'
        run: |
          release_date="$(date -u +%F)"
          python .github/scripts/export_page_pdf.py HUMOR/index.md Deep-Ethical-PDFs/HUMOR.pdf
          pdfinfo Deep-Ethical-PDFs/HUMOR.pdf
          pdftotext Deep-Ethical-PDFs/HUMOR.pdf /tmp/humor-check.txt
          grep -F "WinRAR never saw us coming" /tmp/humor-check.txt
          python .github/scripts/update_pdf_records.py --date "$release_date"
          python .github/scripts/build_pdf_zip.py --date "$release_date"
          python .github/scripts/set_pdf_release.py --date "$release_date" --initial-only --new-pdfs '["HUMOR.pdf"]'

      - name: Regenerate every indexed PDF
        if: github.event_name != 'push'
        run: |
          release_date="$(date -u +%F)"
          python .github/scripts/update_pdf_records.py --date "$release_date" --prepare-index
          python .github/scripts/update_source_format_links.py
          python .github/scripts/export_all_page_pdfs.py

      - name: Refresh index, checksums, archive, and release metadata
        if: github.event_name != 'push'
        run: |
          release_date="$(date -u +%F)"
          python .github/scripts/update_pdf_records.py --date "$release_date"
          python .github/scripts/build_pdf_zip.py --date "$release_date"
          python .github/scripts/set_pdf_release.py --date "$release_date"
          python .github/scripts/export_page_pdf.py meta-pdfs.md Deep-Ethical-PDFs/META-PDFS.pdf
          python .github/scripts/update_pdf_records.py --date "$release_date"
          python .github/scripts/build_pdf_zip.py --date "$release_date"
          python .github/scripts/set_pdf_release.py --date "$release_date"

      - name: Commit the weekly snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add Deep-Ethical-PDFs/*.pdf \
            Deep-Ethical-PDFs/BUILD-REPORT.txt \
            Deep-Ethical-PDFs/PDF-INDEX.csv \
            Deep-Ethical-PDFs/PDF-INDEX.md \
            Deep-Ethical-PDFs/SHA256SUMS.txt \
            assets/page-pdf-download.js \
            meta-pdfs.md
          if git diff --cached --quiet; then
            echo "No PDF snapshot changes to commit."
            exit 0
          fi
          git commit -m "Refresh weekly public-page PDFs"
          git push

      - name: Checkout canonical source repository
        uses: actions/checkout@v4
        with:
          repository: deepethics/Canonical-Files-ACCM-Deep-Ethics-Project
          path: _upstream/canonical
          persist-credentials: false

      - name: Checkout cold-testing source repository
        uses: actions/checkout@v4
        with:
          repository: deepethics/Cold-DeepEthics-Testing-Default-AIs
          path: _upstream/cold-tests
          persist-credentials: false

      - name: Generate read-only sibling portals
        run: |
          python .github/scripts/build_sibling_portals.py \
            --site . \
            --canonical _upstream/canonical \
            --cold-tests _upstream/cold-tests

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
