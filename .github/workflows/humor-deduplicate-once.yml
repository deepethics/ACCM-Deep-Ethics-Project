name: HUMOR source-preserving cleanup (one-off)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/humor-deduplicate-once.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      APPLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Markdown heading verification
        run: gem install --user-install --no-document kramdown kramdown-parser-gfm
      - name: Validate reviewed exact-span edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import subprocess, textwrap
          revision = 'ee1b7bd9c839b34bd3b32994d9d830025d7bd929:.github/workflows/humor-deduplicate-once.yml'
          workflow = subprocess.run(['git','show',revision], capture_output=True, text=True, check=True).stdout
          body = workflow.split("          python - <<'PY'\n",1)[1].split('          PY\n',1)[0]
          code = textwrap.dedent(body)
          old = "r'^(#{1,6})\\s+(.+?)\\s*$'"
          new = "r'^(?:>\\s*)*(#{1,6})\\s+(.+?)\\s*$'"
          assert code.count(old) == 1
          code = code.replace(old,new)
          code = code.replace("if level > 2 or title.startswith('Sense of Humor'): continue", "if level > 2 or title.startswith(('Sense of Humor','**100+ A.I.s Roast')): continue")
          code = code.replace("'</a>\\n'", "'</a>\\n\\n'")
          old = "    if n in ids:\n        line = line.rstrip('\\r\\n') + ' {#' + ids[n] + '}\\n'"
          new = "    if n in ids:\n        prefix += '<a id=\"' + html.escape(ids[n], quote=True) + '\"></a>\\n\\n'\n        line = line.rstrip('\\r\\n') + ' {#humor-anchor-' + ids[n] + '}\\n'"
          assert code.count(old) == 1
          code = code.replace(old,new)
          check = "assert set(ids.values()).issubset(set(parsed.ids)), 'An old heading link was lost'"
          diagnostics = "print('MISSING_IDS', sorted(set(ids.values())-set(parsed.ids)))\n(audit_dir / 'preview.md').write_text(after,encoding='utf-8')\n(audit_dir / 'preview.html').write_text(rendered,encoding='utf-8')\n(audit_dir / 'before.html').write_text(render(before),encoding='utf-8')\n" + check
          assert check in code
          code = code.replace(check,diagnostics)
          exec(compile(code, 'reviewed-humor-cleanup', 'exec'))
          PY
      - name: Preserve before, after, diff and title audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humor-deduplication-audit
          path: ${{ runner.temp }}/humor-cleanup/
          retention-days: 30
