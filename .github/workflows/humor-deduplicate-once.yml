name: HUMOR source-preserving cleanup (one-off)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/humor-deduplicate-once.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventory headings and source integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          p = Path('HUMOR/README.md')
          data = p.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob == '889e063d2bfb0634c790e77b46a9851df7055414', 'Source changed; refresh review before editing'
          lines = data.decode('utf-8').splitlines()
          print('SOURCE', blob, 'BYTES', len(data), 'LINES', len(lines))
          fence = None
          for i, line in enumerate(lines, 1):
              if re.match(r'^(```|~~~)', line):
                  marker = line[:3]
                  fence = None if fence == marker else marker if fence is None else fence
              if fence is None and re.match(r'^#{1,3} ', line):
                  print(f'{i:5}: {line}')
          PY
