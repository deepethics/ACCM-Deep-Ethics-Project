# Build the ACCM Deep Ethics Project umbrella site from three public repositories.
name: Deploy ACCM Deep Ethics Project umbrella site

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Refresh the two public sibling repositories even when this repository did not change.
  schedule:
    - cron: "17 */6 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ACCM Deep Ethics Project
        uses: actions/checkout@v4
      - name: Checkout canonical source repository
        uses: actions/checkout@v4
        with:
          repository: deepethics/Canonical-Files-ACCM-Deep-Ethics-Project
          path: _upstream/canonical
          persist-credentials: false
      - name: Checkout cold-testing source repository
        uses: actions/checkout@v4
        with:
          repository: deepethics/Cold-DeepEthics-Testing-Default-AIs
          path: _upstream/cold-tests
          persist-credentials: false
      - name: Generate read-only sibling portals
        run: |
          python .github/scripts/build_sibling_portals.py \
            --site . \
            --canonical _upstream/canonical \
            --cold-tests _upstream/cold-tests
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
