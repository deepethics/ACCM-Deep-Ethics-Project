ocal risk</text><text x="444" y="215" font-size="15" font-weight="600">Larger comparable mechanism</text><text x="300" y="274" font-size="16" font-weight="600">Apply the same criterion in both directions.</text><text x="300" y="294" font-size="12">Compare actual mechanisms, scale, exposure, authority and consequences.</text></g></svg>