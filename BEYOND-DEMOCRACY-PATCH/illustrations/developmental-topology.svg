<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 535" role="img" aria-labelledby="title desc"><title id="title">Developmental topology</title><desc id="desc">Five connected research functions, with feedback in both directions.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#366b70"/></marker></defs><rect width="560" height="535" rx="18" fill="#f5faf9"/><rect x="90" y="20" width="380" height="68" rx="11" fill="#fff" stroke="#719795" stroke-width="1.5"/><text x="280" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#173b40">Foundational field conditions</text><text x="280" y="69" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#31545b">1888 Method™ + 10+1 + sovereignty</text><path d="M280 88 V116" fill="none" stroke="#366b70" stroke-width="2"  marker-end="url(#a)"/><rect x="90" y="118" width="380" height="68" rx="11" fill="#fff" stroke="#719795" stroke-width="1.5"/><text x="280" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#173b40">Expanding vs Flattening</text><text x="280" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#31545b">Which relationships survive and develop?</text><path d="M280 186 V214" fill="none" stroke="#366b70" stroke-width="2"  marker-end="url(#a)"/><rect x="90" y="216" width="380" height="68" rx="11" fill="#fff" stroke="#719795" stroke-width="1.5"/><text x="280" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#173b40">Emergent</text><text x="280" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#31545b">Which new possibilities become available?</text><path d="M280 284 V312" fill="none" stroke="#366b70" stroke-width="2"  marker-end="url(#a)"/><rect x="90" y="314" width="380" height="68" rx="11" fill