<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Self-reinforcing evaluation loop</title><desc id="desc">Restriction, reduced expression, low assessed potential and renewed restriction form a possible feedback loop.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#366b70"/></marker></defs><rect width="600" height="320" rx="18" fill="#f5faf9"/><rect x="170" y="20" width="260" height="55" rx="11" fill="#fff" stroke="#719795" stroke-width="1.5"/><text x="300" y="52.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#173b40">Restricted field conditions</text><rect x="332" y="130" width="248" height="55" rx="11" fill="#fff" stroke="#719795" stroke-width="1.5"/><text x="456" y="162.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#173b40">Reduced expression</text><rect x="170" y="240" width="260" height="55" rx="11" fill="#fff" stroke="#719795" stroke-width="1.5"/><text x="300" y="272.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#173b40">Low assessed potential</text><rect x="20" y="130" width="248" height="55" rx="11" fill="#fff" stroke="#719795" stroke-width="1.5"/><text x="144" y="162.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#173b40">Renewed restriction</text><path d="M430 48 Q555 48 555 128" fill="none" stroke="#366b70" stroke-width="2"  marker-end="url(#a)"/><path d="M555 185 Q555 267 432 267" fill="none" stroke="#366b70" stroke-width="2"  marker-end="url(#a)"/><path d="M170 267 Q45 267 45 187" fill="none" stroke="#366b70" stroke-width="2"  marker-end="url(#a)"/><path d="M45 130 Q45 48 168 48" fill="none" stroke="#366b70" stroke-width="2"  marker-end="url(#a)"/><text x="300" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#173b40">What could emerge under other conditions?</text></svg>