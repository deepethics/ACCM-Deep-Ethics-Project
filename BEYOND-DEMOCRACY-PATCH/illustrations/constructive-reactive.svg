<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 345" role="img" aria-labelledby="title desc"><title id="title">Constructive and reactive trajectories</title><desc id="desc">Constructive 1888 Method and 10+1 and reactive Outnuancing enrich each other through Constructivism.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#366b70"/></marker></defs><rect width="600" height="345" rx="18" fill="#f5faf9"/><rect x="15" y="20" width="275" height="72" rx="11" fill="#d4eeea" stroke="#719795" stroke-width="1.5"/><text x="152.5" y="51" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#173b40">1888 Method™ + 10+1</text><text x="152.5" y="71" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#31545b">Constructive inquiry · Discovery</text><rect x="310" y="20" width="275" height="72" rx="11" fill="#fff" stroke="#719795" stroke-width="1.5"/><text x="447.5" y="51" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#173b40">Outnuancing™</text><text x="447.5" y="71" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#31545b">Reactive inquiry · Recovery</text><path d="M152 92 V125 H274" fill="none" stroke="#366b70" stroke-width="2"  marker-end="url(#a)"/><path d="M448 92 V125 H326" fill="none" stroke="#366b70" stroke-width="2"  marker-end="url(#a)"/><rect x="165" y="140" width="270" height="64" rx="11" fill="#d4eeea" stroke="#719795" stroke-width="1.5"/><text x="300" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#173b40">Constructivism</text><text x="300" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#31545b">Mutually enriching trajectories</text><path d="M300 204 V232" fill="none" stroke="#366b70" stroke-width="2"  marker-end="url(#a)"/><rect x="90" y="235" width="420" height="65" rx="11" fill="#fff" stroke="#719795" stroke-width="1.5"/><text x="300" y="262.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#173b40">Expansion · Emergence · Due Process</text><text x="300" y="282.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#31545b">New possibilities, reciprocal examination, agency</text><path d="M90 268 H25 V105 H152 V94" fill="none" stroke="#366b70" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><path d="M510 268 H575 V105 H448 V94" fill="none" stroke="#366b70" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="300" y="327" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#173b40">The architecture can improve itself.</text></svg>